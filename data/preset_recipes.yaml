- id: "PRESET-010"
  name: "DuPont EVA/SAIB — Patente US3476694A (1969)"
  target_viscosity_mpas: 420
  target_solids_pct: 21
  application: "curtain_coater"
  coater: "burkle"
  notes: "Fórmula de DuPont que incorpora copolímero etileno/acetato de vinilo (EVA) y sacarosa acetato isobutirato (SAIB) como modificadores de película. NC 50%, EVA 20%, SAIB 30% en sólidos. Solventes: tolueno 50%, IPA 15%, acetato de butilo 35%."
  metadata:
    best_for: "Investigación de nuevos modificadores de película, laboratorio"
    pros:
      - "EVA aporta flexibilidad sin plastificante externo"
      - "SAIB mejora dureza superficial y brillo"
      - "Buena estabilidad de viscosidad en cuba"
      - "Documentado con datos de viscosidad Ford Cup"
    cons:
      - "Alto contenido de tolueno (tóxico, olor fuerte)"
      - "EVA y SAIB no son comunes en la industria del disco"
      - "Requiere ball milling para dispersión homogénea"
      - "Sin probar en corte real de lacquer disc"
    hardware:
      coater_type: "Cortina Burkle con ball mill previo"
