- id: "PRESET-008"
  name: "Audio Devices — Patente US2607699A (1948)"
  target_viscosity_mpas: 350
  target_solids_pct: 24
  application: "curtain_coater"
  coater: "burkle"
  notes: "Fórmula clásica de Audio Devices (George Sutheim, 1948). Una de las primeras recetas documentadas de lacquer disc moderna. Base de todas las formulaciones posteriores."
  metadata:
    best_for: "Referencia histórica, base para experimentación, cortes generales"
    pros:
      - "Receta probada y documentada en patente US2607699A"
      - "Balance clásico NC/plastificante/solvente"
      - "Bajo ruido de superficie reportado"
      - "Incluye pigmento anticlimbing (0.05-0.25%)"
    cons:
      - "Alto contenido de alcohol (18%) puede causar blush en alta humedad"
      - "NC al 33% de sólidos → película quebradiza sin plastificante suficiente"
      - "Solventes mayormente ésteres de baja ebullición → secado rápido, propenso a burbujas"
    hardware:
      coater_type: "Cortina Burkle o spin coater"
      drying: "Túnel 22-25°C, 15-20 min"
      curing: "24-48h a 22-25°C"
      cutting_lathe: "Neumann VMS-70, Scully, Westrex"
      stylus: "Sapphire 3.0-3.5 mil"
    common_issues:
      - "Blush en alta humedad → reducir alcohol, aumentar butanol"
      - "Climbing → añadir 0.1% de carbonato de calcio coloidal o sílice"
