# Example Recipes for Burkle Curtain Coater

- id: "REC-001"
  name: "Standard NC Lacquer for Silvering"
  target_viscosity_mpas: 600
  target_solids_pct: 18
  application: "curtain_coater"
  coater: "burkle"
  notes: "Standard formulation compatible with silvering"
  components:
    - id: "RES-001"
      name: "Nitrocellulose RS 1/2 sec"
      concentration_pct: 18
    - id: "SOL-001"
      name: "Butyl Acetate"
      concentration_pct: 55
    - id: "SOL-004"
      name: "MAK (Methyl Amyl Ketone)"
      concentration_pct: 20
    - id: "SOL-005"
      name: "Butyl Cellosolve"
      concentration_pct: 5
    - id: "ADD-001"
      name: "Leveling Agent BYK-307"
      concentration_pct: 0.5
    - id: "ADD-002"
      name: "Defoamer BYK-024"
      concentration_pct: 0.3
    - id: "ADD-003"
      name: "Adhesion Promoter Silane A-187"
      concentration_pct: 1.2

