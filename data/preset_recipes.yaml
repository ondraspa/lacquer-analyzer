- id: "PRESET-001"
  name: "NC Clásica — Corte General (33⅓ RPM)"
  target_viscosity_mpas: 600
  target_solids_pct: 18
  application: "curtain_coater"
  coater: "burkle"
  notes: "Formulación NC estándar universal. La más usada en estudios de mastering."
  metadata:
    best_for: "33⅓ RPM LPs, corte general, la mayoría de géneros musicales"
    pros:
      - "Balance probado durante décadas en la industria"
      - "Excelente chip flow para cortes de groove estándar"
      - "Buena adhesión al disco de aluminio"
      - "Compatible con todos los procesos de plateado"
      - "Ventana de procesamiento amplia (±10% solventes)"
    cons:
      - "No óptima para cortes muy calientes (alta modulación)"
      - "Puede mostrar cráteres en condiciones de alta humedad"
      - "Requiere control preciso de temperatura (22-26°C)"
    hardware:
      coater_type: "Cortina Burkle o cualquier cortina de 2 rodillos"
      drying: "Túnel de secado 25-30°C, 15-20 min"
      curing: "24-48 horas a 22-25°C antes del plateado"
      cutting_lathe: "Neumann VMS-70/VMS-80, Scully, Westrex"
      stylus: "Sapphire o Ruby 3.0-3.5 mil"
    common_issues:
      - "Si aparece cráteres → reducir MEK, aumentar Butilglicol"
      - "Si el chip es quebradizo → aumentar plastificante 2%"
