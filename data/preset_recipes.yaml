- id: "PRESET-003"
  name: "Mastering — Alta Definición (Corte de Biblioteca / Audiophile)"
  target_viscosity_mpas: 400
  target_solids_pct: 15
  application: "curtain_coater"
  coater: "burkle"
  notes: "Baja viscosidad y sólidos para máxima transferencia de detalle. Usada en cortes de biblioteca y ediciones audiophile."
  metadata:
    best_for: "Cortes de biblioteca, ediciones audiophile, jazz clásico, música acústica, voz"
    pros:
      - "Máximo detalle en alta frecuencia (responde a 20kHz+)"
      - "Mejor relación señal/ruido"
      - "Menor distorsión por travesía (tracking distortion)"
      - "Excelente para pasajes de baja modulación"
    cons:
      - "No soporta grooves muy calientes (limitación en nivel)"
      - "Laca más blanda → menor vida útil del disco maestro"
      - "Requiere ajuste fino de la cortina (más delicada)"
      - "Mayor sensibilidad a temperatura y humedad"
    hardware:
      coater_type: "Cortina Burkle con filtro de 5 µm en línea"
      drying: "Túnel 22-25°C, 25-30 min (secado muy lento)"
      curing: "24h a 22°C + 24h a 25°C (curado escalonado)"
      cutting_lathe: "Neumann VMS-80 con cabezal refrigerado"
      stylus: "Sapphire 3.5-4.0 mil para máximo detalle"
    common_issues:
      - "Pérdida de nivel → no apta para cortes > 0 dB"
      - "Cratering por solventes lentos → ajustar relación Butanol/Butilglicol"
