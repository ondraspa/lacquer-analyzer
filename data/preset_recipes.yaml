- id: "PRESET-004"
  name: "Secado Rápido — Producción en Serie (45 RPM)"
  target_viscosity_mpas: 500
  target_solids_pct: 20
  application: "curtain_coater"
  coater: "burkle"
  notes: "Optimizada para flujo de producción rápido con túnel de secado a 35°C."
  metadata:
    best_for: "Producción en serie de 45 RPM, plantas de pressing de alto volumen"
    pros:
      - "Secado en 10-12 minutos (vs 20-25 de NC clásica)"
      - "Mayor throughput: 3-4 discos/hora vs 1-2"
      - "Buena compatibilidad con plateado automatizado"
      - "Menor riesgo de contaminación por polvo (menos tiempo expuesto)"
    cons:
      - "Ventana de proceso estrecha (±3% en solventes)"
      - "Mayor riesgo de cráteres por evaporación rápida"
      - "La laca envejece más rápido en la cuba de cortinado"
      - "No apta para cortes audiophile (pierde detalle en agudos)"
    hardware:
      coater_type: "Cortina Burkle con bomba de recirculación rápida"
      drying: "Túnel de secado 35-40°C con flujo de aire forzado, 10-12 min"
      curing: "12-24 horas a 25°C"
      cutting_lathe: "Scully automático, Neumann VMS-70"
      stylus: "Ruby 3.0 mil (mayor resistencia al desgaste)"
    common_issues:
      - "Cratering → reducir temperatura del túnel a 32°C"
      - "Laca espesa en cuba → añadir 2% de acetato de butilo cada hora"
