- id: "PRESET-002"
  name: "Hot Cut — Alta Modulación (45 RPM / Maxi-Single)"
  target_viscosity_mpas: 750
  target_solids_pct: 22
  application: "curtain_coater"
  coater: "burkle"
  notes: "Mayor contenido de sólidos y NC de alta viscosidad para cortes calientes con mucha modulación lateral."
  metadata:
    best_for: "45 RPM singles, maxi-singles, cortes de alta modulación, música dance/electrónica"
    pros:
      - "Soporta grooves más profundos sin distorsión"
      - "Mejor respuesta en altas frecuencias"
      - "Mayor resistencia al salto de aguja"
      - "Mejor chip flow a alta velocidad de corte"
    cons:
      - "Más difícil de filtrar (mayor viscosidad)"
      - "Requiere mayor tiempo de curado (48-72h)"
      - "Mayor tensión superficial → más propenso a cráteres"
      - "No recomendada para cortes de baja modulación (pérdida de detalle)"
    hardware:
      coater_type: "Cortina Burkle con calentamiento de laca a 30°C"
      drying: "Túnel 28-32°C, 20-25 min"
      curing: "48-72 horas a 22-25°C"
      cutting_lathe: "Neumann VMS-80, Haeco Scully con cabezal caliente"
      stylus: "Ruby 2.5-3.0 mil para alta modulación"
    common_issues:
      - "Cratering → pre-calentar disco a 30°C antes del cortinado"
      - "Viscosidad alta → verificar temperatura de la laca (debe estar a 25-28°C)"
